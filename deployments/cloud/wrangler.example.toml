# Example Cloudflare Workers config for the Verifyistic API (cloud edition, ADR-001).
# Copy per environment (staging/production); database_id / KV ids are filled per environment.
# NEVER put secrets in this file — inject at runtime with `wrangler secret put` (doc 06 §10, doc 13 §11).

name = "verifyistic-api"
main = "../../apps/api/src/index.ts"
compatibility_date = "2026-09-01"

[vars]
VERIFYISTIC_MODE = "cloud"
ENVIRONMENT = "staging" # staging | production

[[d1_databases]]
binding = "DB"
database_name = "verifyistic-db-staging"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "verifyistic-staging-private" # private bucket, doc 09 §1-3

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[queues.producers]]
binding = "QUEUE_PDF"
queue = "pdf-finalize"

[[queues.producers]]
binding = "QUEUE_EMAIL"
queue = "email"

[[queues.producers]]
binding = "QUEUE_WEBHOOKS"
queue = "webhooks"

# Consumers are declared on the worker app that processes jobs (apps/worker, Phase 6).
# Runtime secrets to add via `wrangler secret put`:
#   WPISTIC_OIDC_CLIENT_SECRET, WEBHOOK_ENCRYPTION_KEY, EMAIL_API_KEY, LICENSE_SIGNING_KEY_ID (public verify key embedded in code, never the private key)
