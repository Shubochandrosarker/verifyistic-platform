name = "verifyistic-api"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# LIVE custom domain (Phase 14) — Worker on api.verifyistic.com
routes = [
  { pattern = "api.verifyistic.com", custom_domain = true }
]

[vars]
VERIFYISTIC_MODE = "cloud"
ENVIRONMENT = "production"
VERIFY_BASE_URL = "https://api.verifyistic.com"
SIGNER_BASE_URL = "https://api.verifyistic.com"

[[d1_databases]]
binding = "DB"
database_name = "verifyistic-db-staging"
database_id = "f432985b-3644-4cf7-b418-34722f88cc45"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "verifyistic"

# Secrets (runtime): WEBHOOK_ENCRYPTION_KEY, PADDLE_WEBHOOK_SECRET, LICENSE_SIGNING_SECRET via `wrangler secret put`.
