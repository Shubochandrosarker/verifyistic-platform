name = "verifyistic-worker"
main = "src/cloud.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

[vars]
VERIFYISTIC_MODE = "cloud"
ENVIRONMENT = "production"
VERIFY_BASE_URL = "https://api.verifyistic.com"
SIGNER_BASE_URL = "https://api.verifyistic.com"
RESEND_FROM = "Verifyistic <noreply@verifyistic.com>"
SMTP_HOST = "mail.wpistic.com"
SMTP_PORT = "465"
SMTP_MODE = "tls"
SMTP_FROM = "Verifyistic <noreply@verifyistic.com>"
SMTP_HELO = "verifyistic.com"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "verifyistic-db-staging"
database_id = "f432985b-3644-4cf7-b418-34722f88cc45"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "verifyistic"

# Runtime secrets (set with `wrangler secret put`):
# WEBHOOK_ENCRYPTION_KEY, RESEND_API_KEY (legacy), SMTP_USER, SMTP_PASSWORD
