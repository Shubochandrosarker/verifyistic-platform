[extend]
useDefault = true

# The doc pack under ~/.wpistic is outside this repo; nothing to allowlist yet.
# Add repo-specific false positives here as they appear (never allowlist real secrets).

# Paddle CLIENT-SIDE token (publishable by design — equivalent to Stripe pk_live).
# Safe to expose in browser bundles; NOT a secret. Live in dashboard wrangler vars.
[[rules]]
id = "paddle-publishable-client-token"
description = "Paddle publishable client token (public by design)"
regex = '''live_[a-f0-9]{32}'''

[allowlist]
description = "Paddle publishable client tokens are public by design"
regexes = ['''live_e5df4646dbdfc3686bbf4ee6536''']
